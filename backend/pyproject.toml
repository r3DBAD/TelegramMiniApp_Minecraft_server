[project]
name = "minecraft-telegram-panel-backend"
version = "0.1.0"
description = "Telegram Mini App control panel for a Dockerized Minecraft server."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.8,<4",
    "asyncpg>=0.29,<1",
    "fastapi>=0.111,<1",
    "pydantic-settings>=2.3,<3",
    "uvicorn[standard]>=0.30,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
