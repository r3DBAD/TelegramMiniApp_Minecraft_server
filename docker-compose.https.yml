services:
  panel-caddy:
    image: caddy:2-alpine
    container_name: minecraft-panel-caddy
    restart: unless-stopped
    env_file:
      - ./.env.panel
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - panel-web

volumes:
  caddy_data:
  caddy_config:
