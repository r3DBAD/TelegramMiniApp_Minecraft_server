services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft-1-21-11
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
      - "${RCON_PORT:-25575}:25575"
    environment:
      EULA: "TRUE"
      UID: "${MC_UID:-501}"
      GID: "${MC_GID:-20}"
      TYPE: "VANILLA"
      VERSION: "${SERVER_VERSION:-1.21.11}"
      MEMORY: "${MEMORY:-4G}"

      SERVER_NAME: "${SERVER_NAME:-Private Minecraft Server}"
      MOTD: "${MOTD:-Private Minecraft 1.21.11 server}"
      ICON: "${ICON:-}"

      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST_FILE: "/data/whitelist.json"
      OPS_FILE: "/data/ops.json"

      ONLINE_MODE: "${ONLINE_MODE:-false}"
      ENFORCE_SECURE_PROFILE: "false"
      MODE: "${GAME_MODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      HARDCORE: "${HARDCORE:-false}"
      PVP: "${PVP:-true}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-10}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-16}"
      ENABLE_COMMAND_BLOCK: "${ENABLE_COMMAND_BLOCK:-false}"
      ALLOW_NETHER: "true"
      ENABLE_STATUS: "true"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-change-me-before-start}"
      RCON_PORT: "${RCON_PORT:-25575}"

      OVERRIDE_SERVER_PROPERTIES: "true"
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./mods:/mods:ro
